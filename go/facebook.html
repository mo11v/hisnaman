<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>فتح Facebook</title>
</head>
<body>
  <p>جارٍ فتح صفحة حصن أمان على Facebook…</p>
  <p><a href="https://www.facebook.com/profile.php?id=61562172514137" rel="noreferrer">اضغط هنا إذا لم يتم التحويل تلقائيًا</a></p>
  <script>
    const webUrl = "https://www.facebook.com/profile.php?id=61562172514137";
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.location.href = "fb://page/61562172514137";
      setTimeout(() => window.location.replace(webUrl), 1400);
    } else {
      window.location.replace(webUrl);
    }
  </script>
</body>
</html>
